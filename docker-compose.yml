services:
  db:
    image: mongo:8
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [mongo_data:/data/db]
  api:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://db:27017/loan_copilot
      JWT_SECRET: change-this-for-production
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  mongo_data:
