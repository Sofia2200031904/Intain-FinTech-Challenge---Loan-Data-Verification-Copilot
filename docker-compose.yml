services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loancopilot
      POSTGRES_USER: loancopilot
      POSTGRES_PASSWORD: loancopilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loancopilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://loancopilot:loancopilot@db:5432/loancopilot
      JWT_SECRET: change-this-for-production
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  postgres_data:
